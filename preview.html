<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TiffinFlow — Enterprise Pro-Rated Tiffin SaaS & KDS</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18, ReactDOM, and Babel for modular component execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Modular External Design System Stylesheet: Zero Inline CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Modular Application Logic Script: Decoupled for Scalability & Debugging -->
  <script type="text/babel" src="app.js"></script>

  <!-- Local File Protocol Friendly Helper Banner -->
  <script>
    window.addEventListener('load', () => {
      if (window.location.protocol === 'file:') {
        // If loaded directly via file://, check if root rendered; if browser blocked local XHR, prompt to use local server
        setTimeout(() => {
          const rootEl = document.getElementById('root');
          if (!rootEl || !rootEl.hasChildNodes()) {
            const banner = document.createElement('div');
            banner.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-bold px-6 py-3 rounded-xl shadow-2xl z-[9999] flex items-center gap-3 text-sm';
            banner.innerHTML = '<span>🍱 TiffinFlow is running on your Express server!</span> <a href="http://localhost:5000" target="_blank" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg text-xs hover:bg-slate-800 transition">Open http://localhost:5000 →</a>';
            document.body.prepend(banner);
          }
        }, 800);
      }
    });
  </script>
</body>
</html>
