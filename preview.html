    // Math Engine helper for pro-rating
    function calculateProratedMath(monthlyPrice, monthStr, pauseLogs) {
      const [year, month] = monthStr.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      let totalWeekdays = 0;
      let pausedWeekdays = 0;
      let deliveredWeekdays = 0;
      const schedule = [];

      for (let d = 1; d <= daysInMonth; d++) {
        const curDate = new Date(year, month - 1, d);
        const dayOfWeek = curDate.getDay();
        const isWeekday = dayOfWeek !== 0 && dayOfWeek !== 6;
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayName = curDate.toLocaleDateString('en-US', { weekday: 'short' });

        if (isWeekday) totalWeekdays++;

        const pause = pauseLogs.find(p => dateStr >= p.start_date && dateStr <= p.end_date);
        let status = 'DELIVERED';
        let charge = 0;

        if (!isWeekday) {
          status = 'WEEKEND';
        } else if (pause) {
          status = 'PAUSED';
          pausedWeekdays++;
        } else {
          status = 'DELIVERED';
          deliveredWeekdays++;
        }

        schedule.push({ date: dateStr, day: d, dayName, isWeekday, status, reason: pause?.reason || null });
      }

      const dailyRate = parseFloat((monthlyPrice / totalWeekdays).toFixed(2));
      const finalAmount = parseFloat((deliveredWeekdays * dailyRate).toFixed(2));
      const savings = parseFloat((pausedWeekdays * dailyRate).toFixed(2));

      return { totalWeekdays, deliveredWeekdays, pausedWeekdays, dailyRate, finalAmount, savings, schedule };
    }

                      onChange={(e) => handlePhoneSearch(e.target.value)}
                    />
                    <span className="absolute left-4 top-3 text-slate-400">🔍</span>
                  </div>

                  {/* Matched Customer Live Card */}
                  {matchedCustomer && (
                    <div className="mt-4 p-4 rounded-xl bg-slate-900/90 border border-white/10 flex flex-col md:flex-row md:items-center justify-between gap-4 animate-fade-in">
                      <div>
                        <div className="flex items-center gap-3">
                          <h4 className="text-lg font-bold text-white">{matchedCustomer.name}</h4>
                          <span className={`text-[10px] uppercase font-bold px-2.5 py-0.5 rounded-full ${matchedCustomer.status === 'ACTIVE' ? 'badge-active' : 'badge-paused'}`}>
                            {matchedCustomer.status === 'ACTIVE' ? '● Active for Lunch' : '⏸️ Currently Paused'}
                          </span>
                        </div>
                        <p className="text-xs text-slate-400 mt-1">📞 {matchedCustomer.phone} • 📍 {matchedCustomer.address}</p>
                        <p className="text-xs text-amber-400 mt-0.5">🍱 Plan: {matchedCustomer.plan_name} (₹{matchedCustomer.monthly_price}/mo) • <em>{matchedCustomer.dietary_notes}</em></p>
                        
                        {matchedCustomer.pause_logs.length > 0 && (
                          <div className="mt-2 text-xs text-rose-300">
                            <strong>Recorded Pauses:</strong> {matchedCustomer.pause_logs.map(p => `${p.start_date} to ${p.end_date} (${p.reason})`).join(', ')}
                          </div>
                        )}
                      </div>

                      <div className="flex gap-2 shrink-0">
                        {matchedCustomer.status === 'PAUSED' ? (
                          <button onClick={() => handleResume(matchedCustomer.subscription_id)} className="btn-secondary text-xs px-3 py-2 text-emerald-400 border-emerald-500/40">
                            ▶ Resume Delivery
                          </button>
                        ) : (
                          <button onClick={() => setPauseModal(matchedCustomer)} className="btn-secondary text-xs px-3 py-2 text-rose-400 border-rose-500/40">
                            ⏸️ Set Pause
                          </button>
                        )}
                        <button onClick={() => setBillModal(matchedCustomer)} className="btn-primary text-xs px-4 py-2">
                          🧮 Compute Pro-Rated Bill
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* SUBSCRIBER TABLE WITH SEARCH, SORT & PAGINATION */}
                <div className="glass-card p-6 space-y-4">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <h3 className="text-lg font-bold text-white">All Subscribers & Monthly Subscriptions</h3>
                    
                    <div className="flex items-center gap-3">
                      <input
                        type="text"
                        placeholder="Search name, phone, address..."
                        className="input-control text-xs w-60"
                        value={search}
                        onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); }}
                      />
                      <select
                        className="input-control text-xs"
                        value={statusFilter}
                        onChange={(e) => { setStatusFilter(e.target.value); setCurrentPage(1); }}
                      >
                        <option value="ALL">All Statuses</option>
                        <option value="ACTIVE">Active Only</option>
                        <option value="PAUSED">Paused Only</option>
                      </select>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr className="border-b border-white/10 text-slate-400 text-xs">
                          <th className="pb-3 font-semibold">Subscriber</th>
                          <th className="pb-3 font-semibold">Phone</th>
                          <th className="pb-3 font-semibold">Plan & Meal Type</th>
                          <th className="pb-3 font-semibold">Status</th>
                          <th className="pb-3 font-semibold text-right">Actions & Billing</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {paginated.map(c => (
                          <tr key={c.id} className="hover:bg-white/[0.02] transition">
                            <td className="py-3">
                              <div className="font-bold text-white">{c.name}</div>
                              <div className="text-xs text-slate-400">{c.address}</div>
                              {c.dietary_notes && <div className="text-[11px] text-amber-400/80">🥗 {c.dietary_notes}</div>}
                            </td>
                            <td className="py-3 font-mono text-slate-300 text-xs">{c.phone}</td>
                            <td className="py-3">
                              <div className="text-slate-200 font-medium">{c.plan_name}</div>
                              <div className="text-xs text-amber-400">₹{c.monthly_price}/mo ({c.meal_type})</div>
                            </td>
                            <td className="py-3">
                              <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full ${c.status === 'ACTIVE' ? 'badge-active' : 'badge-paused'}`}>
                                {c.status}
                              </span>
                            </td>
                            <td className="py-3 text-right">
                              <div className="inline-flex gap-2">
                                {c.status === 'PAUSED' ? (
                                  <button onClick={() => handleResume(c.subscription_id)} className="px-2.5 py-1.5 rounded-lg text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20">
                                    ▶ Resume
                                  </button>
                                ) : (
                                  <button onClick={() => setPauseModal(c)} className="px-2.5 py-1.5 rounded-lg text-xs bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20">
                                    ⏸️ Pause
                                  </button>
                                )}
                                <button onClick={() => setBillModal(c)} className="btn-primary text-xs px-3 py-1.5">
                                  🧮 Bill
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Pagination Footer */}
                  <div className="flex items-center justify-between pt-3 border-t border-white/10 text-xs text-slate-400">
                    <div>Showing Page {currentPage} of {totalPages} ({filtered.length} subscribers)</div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                        disabled={currentPage === 1}
                        className="btn-secondary px-3 py-1 text-xs disabled:opacity-40"
                      >
                        Previous
                      </button>
                      <button
                        onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                        disabled={currentPage >= totalPages}
                        className="btn-secondary px-3 py-1 text-xs disabled:opacity-40"
                      >
                        Next
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 3: KITCHEN DISPATCH BOARD */}
            {activeTab === 'dispatch' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between flex-wrap gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-white">👨‍🍳 Morning Kitchen Dispatch Board</h2>
                    <p className="text-sm text-slate-400">Pre-sorts active lunch dabbas to cook vs paused subscribers on leave today</p>
                  </div>
                  <div className="bg-slate-800/80 px-4 py-2 rounded-xl border border-white/10 text-xs text-slate-300">
                    📅 Target Date: <strong className="text-amber-400">Today (Weekday Delivery)</strong>
                  </div>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  {/* Active List */}
                  <div className="glass-card p-6 border-t-4 border-emerald-500 space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="text-lg font-bold text-emerald-400">✅ Cook & Pack ({activeCount} Dabbas)</h3>
                      <span className="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Mon–Fri Active</span>
                    </div>

                    <div className="space-y-3">
                      {customers.filter(c => c.status === 'ACTIVE').map(c => (
                        <div key={c.id} className="p-3.5 rounded-xl bg-slate-900/80 border border-white/5 space-y-1">
                          <div className="flex justify-between items-center">
                            <h4 className="font-bold text-white text-sm">{c.name}</h4>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/15 text-amber-300">{c.meal_type}</span>
                          </div>
                          <p className="text-xs text-slate-400">📞 {c.phone} • 📍 {c.address}</p>
                          {c.dietary_notes && <p className="text-xs text-amber-400">⚠️ {c.dietary_notes}</p>}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Paused List */}
                  <div className="glass-card p-6 border-t-4 border-rose-500 space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="text-lg font-bold text-rose-400">🚫 Do Not Cook - Paused ({pausedCount})</h3>
                      <span className="text-xs px-2 py-0.5 rounded bg-rose-500/20 text-rose-300">Zero Billing Today</span>
                    </div>

                    <div className="space-y-3">
                      {customers.filter(c => c.status === 'PAUSED').map(c => (
                        <div key={c.id} className="p-3.5 rounded-xl bg-rose-950/20 border border-rose-500/20 space-y-1">
                          <div className="flex justify-between items-center">
                            <h4 className="font-bold text-white text-sm">{c.name}</h4>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-500/20 text-rose-300">On Leave</span>
                          </div>
                          <p className="text-xs text-slate-400">📞 {c.phone}</p>
                          <p className="text-xs text-rose-300">
                            🏖️ <strong>Reason:</strong> {c.pause_logs[0]?.reason || 'Customer requested pause'}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* PAUSE MODAL */}
          {pauseModal && (
            <div className="modal-overlay">
              <div className="glass-card max-w-md w-full p-6 space-y-4 relative animate-fade-in">
                <button onClick={() => setPauseModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-bold text-white">Pause Subscription</h3>
                <p className="text-xs text-slate-400">For <strong>{pauseModal.name}</strong> ({pauseModal.phone})</p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handlePauseSubmit(pauseModal.subscription_id, form.startDate.value, form.endDate.value, form.reason.value);
                }} className="space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Start Date</label>
                      <input name="startDate" type="date" defaultValue="2026-09-14" required className="input-control w-full text-xs" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">End Date</label>
                      <input name="endDate" type="date" defaultValue="2026-09-18" required className="input-control w-full text-xs" />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Reason for Leave</label>
                    <input name="reason" type="text" defaultValue="Diwali Festival / Vacation" required className="input-control w-full text-xs" />
                  </div>
                  <div className="text-[11px] text-amber-400 bg-amber-500/10 p-2.5 rounded-lg border border-amber-500/20">
                    💡 Customer will not be billed for weekdays during this window.
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setPauseModal(null)} className="btn-secondary text-xs px-4 py-2">Cancel</button>
                    <button type="submit" className="btn-primary text-xs px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white">Confirm Pause</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PRO-RATED BILLING MODAL (THE TWIST SOLUTION DISPLAY) */}
          {billModal && (() => {
            const math = calculateProratedMath(billModal.monthly_price, '2026-09', billModal.pause_logs);
            return (
              <div className="modal-overlay">
                <div className="glass-card max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto relative animate-fade-in">
                  <button onClick={() => setBillModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                  
                  <div className="flex items-center justify-between border-b border-white/10 pb-3">
                    <div>
                      <h3 className="text-xl font-bold text-white">Pro-Rated Month-End Invoice</h3>
                      <p className="text-xs text-slate-400">Customer: <strong>{billModal.name}</strong> • Plan: {billModal.plan_name}</p>
                    </div>
                    <span className="text-xs px-2.5 py-1 rounded bg-amber-500/20 text-amber-400 font-mono">
                      Cycle: September 2026
                    </span>
                  </div>

                  {/* FORMULA BREAKDOWN BOX */}
                  <div className="bg-slate-950/80 p-4 rounded-xl border border-amber-500/30 space-y-3">
                    <span className="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">
                      Mathematical Pro-Rating Proof
                    </span>
                    <div className="grid grid-cols-3 md:grid-cols-5 gap-2 text-center text-xs">
                      <div className="p-2 rounded bg-white/5">
                        <div className="text-slate-400">Monthly Plan</div>
                        <div className="font-bold text-white text-sm">₹{billModal.monthly_price}</div>
                      </div>
                      <div className="p-2 rounded bg-white/5">
                        <div className="text-slate-400">Weekdays</div>
                        <div className="font-bold text-white text-sm">{math.totalWeekdays}</div>
                      </div>
                      <div className="p-2 rounded bg-white/5">
                        <div className="text-slate-400">Daily Rate</div>
                        <div className="font-bold text-amber-400 text-sm">₹{math.dailyRate}</div>
                      </div>
                      <div className="p-2 rounded bg-emerald-500/10 border border-emerald-500/30">
                        <div className="text-emerald-400">Delivered</div>
                        <div className="font-bold text-emerald-300 text-sm">{math.deliveredWeekdays} days</div>
                      </div>
                      <div className="p-2 rounded bg-rose-500/10 border border-rose-500/30">
                        <div className="text-rose-400">Paused</div>
                        <div className="font-bold text-rose-300 text-sm">{math.pausedWeekdays} days</div>
                      </div>
                    </div>

                    <div className="flex justify-between items-center pt-3 border-t border-white/10">
                      <div>
                        <div className="text-xs text-slate-300">Formula: {math.deliveredWeekdays} delivered × ₹{math.dailyRate}/day</div>
                        {math.savings > 0 && (
                          <div className="text-xs text-emerald-400 font-semibold">🎉 Customer saved ₹{math.savings} on paused days!</div>
                        )}
                      </div>
                      <div className="text-right">
                        <span className="text-[10px] uppercase text-slate-400">Final Payable Amount</span>
                        <div className="text-3xl font-black text-amber-400">₹{math.finalAmount}</div>
                      </div>
                    </div>
                  </div>

                  {/* ITEMIZED CALENDAR DAYS */}
                  <div className="space-y-2">
                    <h4 className="text-xs font-bold text-white uppercase tracking-wider">Itemized Day-by-Day Calendar (Sept 2026)</h4>
                    <div className="max-h-48 overflow-y-auto border border-white/10 rounded-xl">
                      <table className="w-full text-xs text-left">
                        <thead className="bg-slate-900 sticky top-0 border-b border-white/10 text-slate-400">
                          <tr>
                            <th className="p-2">Date</th>
                            <th className="p-2">Day</th>
                            <th className="p-2">Status</th>
                            <th className="p-2">Notes</th>
                            <th className="p-2 text-right">Billed</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-white/5">
                          {math.schedule.map(d => (
                            <tr key={d.date}>
                              <td className="p-2 text-white font-mono">{d.date}</td>
                              <td className="p-2 text-slate-400">{d.dayName}</td>
                              <td className="p-2">
                                {d.status === 'DELIVERED' && <span className="text-emerald-400 font-semibold">Delivered</span>}
                                {d.status === 'PAUSED' && <span className="text-rose-400 font-semibold">Paused</span>}
                                {d.status === 'WEEKEND' && <span className="text-slate-500">Weekend</span>}
                              </td>
                              <td className="p-2 text-slate-400">{d.reason || (d.status === 'DELIVERED' ? 'Lunch Served' : '-')}</td>
                              <td className="p-2 text-right font-bold text-slate-200">
                                {d.status === 'DELIVERED' ? `₹${math.dailyRate}` : '₹0'}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Actions */}
                  <div className="flex justify-between items-center pt-2">
                    <button 
                      onClick={() => {
                        const billText = `🍱 TIFFINFLOW BILL: ${billModal.name}\nMonth: September 2026\nPlan: ${billModal.plan_name}\nDelivered Days: ${math.deliveredWeekdays}\nPaused Days: ${math.pausedWeekdays}\nFinal Pro-Rated Amount: ₹${math.finalAmount}\nSavings: ₹${math.savings}`;
                        navigator.clipboard.writeText(billText);
                        triggerNotification('Copied WhatsApp bill summary to clipboard!');
                      }}
                      className="btn-secondary text-xs px-3.5 py-2 flex items-center gap-1.5"
                    >
                      📲 Copy WhatsApp Bill
                    </button>
                    <button onClick={() => setBillModal(null)} className="btn-primary text-xs px-5 py-2">
                      Close
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* NEW SUB MODAL */}
          {newSubModal && (
            <div className="modal-overlay">
              <div className="glass-card max-w-md w-full p-6 space-y-4 relative animate-fade-in">
                <button onClick={() => setNewSubModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-bold text-white">Add New Subscriber</h3>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleAddSubscriber({
                    id: Date.now(),
                    subscription_id: Date.now(),
                    name: form.fullName.value,
                    phone: form.phone.value,
                    address: form.address.value,
                    dietary_notes: form.notes.value,
                    plan_id: 1,
                    plan_name: 'Ghar Ki Thali',
                    monthly_price: 2200,
                    meal_type: 'Veg',
                    status: 'ACTIVE',
                    pause_logs: []
                  });
                }} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Full Name</label>
                    <input name="fullName" required placeholder="e.g. Yash Sharma" className="input-control w-full text-xs" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Phone Number</label>
                    <input name="phone" required placeholder="e.g. 9829911223" className="input-control w-full text-xs" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Delivery Address</label>
                    <input name="address" required placeholder="Flat 101, Mansarovar, Jaipur" className="input-control w-full text-xs" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Dietary Notes</label>
                    <input name="notes" placeholder="e.g. Less spicy, pure satvik" className="input-control w-full text-xs" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNewSubModal(false)} className="btn-secondary text-xs px-4 py-2">Cancel</button>
                    <button type="submit" className="btn-primary text-xs px-4 py-2">Activate Subscription</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-white/10 py-6 text-center text-xs text-slate-500">
            🍱 TiffinFlow — Builder Round Evaluation • Fair Pro-Rated Weekday Billing Engine
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
